context:
  version: "0.26.3"

package:
  name: all-smi
  version: ${{ version }}

source:
  url: https://github.com/lablup/all-smi/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 1feeb5f4d10489858220ce051b5685338063f0ad0b2588d8375bbc51516c62d8

build:
  number: 1
  script:
    content:
      # cc-rs appends the generic ${CFLAGS} to every target it compiles for, so the
      # build scripts it compiles for the build platform also get the host target's
      # -march/-mabi flags and fail. The rust activation already mirrors these into
      # the per-triple CFLAGS_<triple>/CXXFLAGS_<triple>/CPPFLAGS_<triple> variables,
      # so the generic ones are redundant.
      - if: linux and build_platform != target_platform
        then:
          - unset CFLAGS CXXFLAGS CPPFLAGS
      # rustc links this target through `-fuse-ld=lld`, and rust-lld doesn't understand
      # the ppc64le relocations GCC emits into zstd-sys' objects ("unknown relocation
      # (31) against symbol ERR_getErrorString"). GCC honours the last -fuse-ld, so
      # appending this switches us back to GNU ld.
      - if: target_platform == "linux-ppc64le"
        then:
          - export CARGO_BUILD_RUSTFLAGS="${CARGO_BUILD_RUSTFLAGS:-} -C link-arg=-fuse-ld=bfd"
      # AWS-LC's ARM64 assembly is GAS syntax, which cl.exe doesn't understand — it
      # skips the `.S` files with D9024/D9027 and the link then dies on the missing
      # object (LNK1181, chacha-armv8.o). aws-lc-sys reaches for clang-cl on this
      # target by itself, but only when no CC is set, and the compiler activation
      # sets CC_aarch64_pc_windows_msvc=cl.exe. Its own AWS_LC_SYS_CC knob wins over
      # that, and only for this crate: every other build script keeps using cl.exe.
      - if: target_platform == "win-arm64"
        then:
          - set "AWS_LC_SYS_CC=clang-cl"
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bin all-smi --root ${{ PREFIX }} --path .
        else:
          - cargo auditable install --locked --no-track --bin all-smi --root %LIBRARY_PREFIX% --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    # aws-lc-sys, pulled in via rustls/russh, builds its C sources with cmake
    - cmake
    - if: unix
      then: make
    # aws-lc-sys assembles its x86 assembly with nasm, and needs clang-cl for the
    # GAS-syntax ARM64 assembly (see the build script)
    - if: target_platform == "win-64"
      then: nasm
    - if: target_platform == "win-arm64"
      then: clang
    # tonic-prost-build compiles the TPU gRPC client, Linux targets only
    - if: linux
      then: libprotobuf

tests:
  - script:
      - all-smi --help
      - all-smi --version
  - package_contents:
      bin:
        - all-smi
      strict: true

about:
  homepage: https://github.com/lablup/all-smi
  summary: Command-line utility for monitoring GPU hardware
  description: |
    all-smi is a command-line utility for monitoring GPU and NPU hardware
    across multiple systems. It provides a real-time view of accelerator
    utilization, memory usage, temperature, power consumption, and other
    metrics, and is designed to be a cross-platform alternative to
    nvidia-smi with support for NVIDIA GPUs, AMD GPUs, NVIDIA Jetson
    platforms, Apple Silicon GPUs, Intel GPUs, Intel Gaudi NPUs, Google
    Cloud TPUs, Tenstorrent NPUs, Rebellions NPUs and Furiosa NPUs.

    The application presents a terminal-based user interface with cluster
    overview and interactive sorting, for both local and remote monitoring,
    and can also export Prometheus metrics via its API mode.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/lablup/all-smi

extra:
  recipe-maintainers:
    - pavelzw
